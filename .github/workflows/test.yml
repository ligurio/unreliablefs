name: Build and test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    branches: [master]
  push:
    branches: [master]

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1

      - name: Setup packages
        run: |
          brew update-reset
          brew upgrade
          brew install --cask macfuse
          brew install cmake fio

      - name: Running CMake
        run: cmake -S . -B build

      - name: Building
        run: cmake --build build --parallel
